    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        /* 白色背景 */
        body {
            background-color: #ffffff;
            color: #333;
            padding: 25px;
        }

        /* 导航栏 —— 美观间距 */
        .nav-tabs {
            display: flex;
            gap: 45px;
            margin-bottom: 35px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }

        .nav-tabs a {
            color: #333;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 8px 4px;
            transition: all 0.2s ease;
        }

        .nav-tabs a:hover,
        .nav-tabs a.active {
            color: #1E90FF;
            border-bottom: 2px solid #1E90FF;
        }

        /* 替换原标签容器为卡片网格，仿图片布局 */
        .tag-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #222;
            border-left: 4px solid #1E90FF;
            padding-left: 10px;
        }

        /* 国漫卡片样式（替代原标签，保留hover效果） */
        .anime-card {
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        /* 封面图容器 */
        .anime-cover {
            width: 100%;
            height: 120px;
            overflow: hidden;
        }

        .anime-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        /* 卡片文字区域 */
        .anime-name {
            padding: 10px;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* hover效果：卡片变色+图片放大 */
        .anime-card:hover {
            background: #1E90FF;
            color: #fff;
        }

        .anime-card:hover .anime-cover img {
            transform: scale(1.05);
        }
    </style>
</head>
